# Local JFrog Artifactory OSS for Hatchery Library API manual tests (#255).
# Not part of the consumer Controller install — contributor/dev tooling only.
#
# UI:  http://127.0.0.1:8082/
# API: http://127.0.0.1:8082/artifactory  (Hatchery base URI)
#
# Artifactory 7.90+ requires PostgreSQL (embedded Derby is gone).
# Needs ~3–4 GiB RAM free. First boot can take several minutes.

name: hatchery-artifactory

services:
  postgres:
    image: postgres:15-alpine
    container_name: hatchery-artifactory-db
    environment:
      POSTGRES_DB: artifactory
      POSTGRES_USER: artifactory
      POSTGRES_PASSWORD: ${ARTIFACTORY_DB_PASSWORD:-artifactory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artifactory -d artifactory"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:${ARTIFACTORY_VERSION:-7.104.14}
    container_name: hatchery-artifactory
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ARTIFACTORY_HTTP_PORT:-8081}:8081"
      - "${ARTIFACTORY_ROUTER_PORT:-8082}:8082"
    volumes:
      - artifactory_data:/var/opt/jfrog/artifactory
    environment:
      JF_ROUTER_ENTRYPOINTS_EXTERNALPORT: "8082"
      JF_SHARED_DATABASE_TYPE: postgresql
      JF_SHARED_DATABASE_URL: "jdbc:postgresql://postgres:5432/artifactory"
      JF_SHARED_DATABASE_USERNAME: artifactory
      JF_SHARED_DATABASE_PASSWORD: ${ARTIFACTORY_DB_PASSWORD:-artifactory}
      JF_SHARED_DATABASE_DRIVER: org.postgresql.Driver
      # Pre-supply keys so router does not wait 5m for a file that never appears
      # if a prior service fails early.
      JF_SHARED_SECURITY_MASTERKEY: ${ARTIFACTORY_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JF_SHARED_SECURITY_JOINKEY: ${ARTIFACTORY_JOIN_KEY:-a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4}
    restart: unless-stopped
    ulimits:
      nproc: 65535
      nofile:
        soft: 32000
        hard: 40000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8082/artifactory/api/system/ping || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 180s

volumes:
  artifactory_data:
  postgres_data:
