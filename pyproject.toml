[project]
name = "hatchery"
version = "0.1.0"
description = "Local web application for creating and managing KVM virtual machines"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "gunicorn",
    "pycdlib>=1.20.0",
    "pydantic",
    "pywinrm",
    "pyyaml",
]

[project.scripts]
hatchery = "lib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.hatch.build.targets.wheel.force-include]
"hatchery.py" = "hatchery.py"
"templates" = "templates"
"static" = "static"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[tool.ruff]
line-length = 100
exclude = [".hatchery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-fail-under=90"
markers = [
    "hypervisor: requires a real Nest/hypervisor; excluded from multi-OS CI",
]
