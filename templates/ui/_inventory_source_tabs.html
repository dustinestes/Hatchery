{# Shared Cached | Library tab strip. Requires: tab_prefix, tablist_label #}
<div class="inventory-tabs" role="tablist" aria-label="{{ tablist_label }}">
  <button type="button" class="inventory-tab" role="tab" id="{{ tab_prefix }}-tab-cache"
          aria-selected="true" aria-controls="{{ tab_prefix }}-panel-cache" tabindex="0">Cached</button>
  <button type="button" class="inventory-tab{% if not library_enabled %} inventory-tab--disabled{% endif %}"
          role="tab" id="{{ tab_prefix }}-tab-library"
          aria-selected="false"
          aria-controls="{{ tab_prefix }}-panel-library"
          tabindex="-1"
          {% if not library_enabled %}disabled aria-disabled="true" title="Enable Library in Settings → General"{% endif %}>Library</button>
</div>
