{% extends "base.html" %}

{% block title %}Nests — Hatchery{% endblock %}

{% block content %}
<div class="pane-header">
  <h1 class="pane-title">Nests</h1>
  <p class="pane-subtitle">Real-time inventory of VMs on each Nest host.</p>
</div>

<div class="nests-layout">

  <!-- Left: nest navigator -->
  <nav class="nests-nav" aria-label="Nests">
    <div class="nests-nav-item active" data-nest="local">
      <span class="nest-status-dot nest-status-dot--green"></span>
      <span class="nests-nav-label">local</span>
    </div>
  </nav>

  <!-- Right: VM inventory for the selected nest -->
  <div class="nests-content" id="nests-content">
    <div class="nests-content-header">
      <span class="nests-content-title">local</span>
      <span class="nests-refresh-label" id="nests-refresh-label"></span>
    </div>

    <div id="vm-list" class="vm-inventory">
      <div class="vm-inventory-empty" id="vm-empty" style="display:none">
        No VMs found on this Nest. <a href="{{ url_for('hatch_clutch') }}" class="link">Hatch a Clutch</a> to get started.
      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  const vmList      = document.getElementById('vm-list');
  const emptyMsg    = document.getElementById('vm-empty');
  const refreshLabel = document.getElementById('nests-refresh-label');

  const VM_STATUS_LABEL = {
    'running':     'Running',
    'shut off':    'Shut Off',
    'paused':      'Paused',
    'suspended':   'Suspended',
    'crashed':     'Crashed',
    'pmsuspended': 'Suspended (PM)',
  };

  const HATCH_STATUS_LABEL = {
    'pending':      'Pending',
    'hatching':     'Hatching',
    'provisioning': 'Provisioning',
    'fledged':      'Fledged',
    'failed':       'Failed',
    'culled':       'Culled',
  };

  const SCRIPT_STATUS_LABEL = {
    'pending':   'Pending',
    'running':   'Running',
    'succeeded': 'Succeeded',
    'failed':    'Failed',
    'skipped':   'Skipped',
  };

  const SCRIPT_STATUS_CLASS = {
    'pending':   'script-status--pending',
    'running':   'script-status--running',
    'succeeded': 'script-status--succeeded',
    'failed':    'script-status--failed',
    'skipped':   'script-status--skipped',
  };

  function escHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );
  }

  function fmtTime(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString(undefined, {
      month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  }

  function statusClass(status) {
    if (status === 'running') return 'running';
    if (status === 'shut off') return 'shut-off';
    if (status === 'paused' || status === 'suspended' || status === 'pmsuspended') return 'paused';
    return 'unknown';
  }

  function renderPasswordCell(vm) {
    if (vm.admin_password === null || vm.admin_password === undefined) {
      return vm.admin_username
        ? `<span class="vm-field-muted">hidden — enable in Settings</span>`
        : '—';
    }
    const id = `pw-${escHtml(vm.name)}`;
    return `
      <span class="vm-password-wrap">
        <input type="password" id="${id}" class="vm-password-field" value="${escHtml(vm.admin_password)}" readonly>
        <button class="vm-password-toggle" aria-label="Show password" onclick="
          var f=this.previousElementSibling;
          f.type=f.type==='password'?'text':'password';
          this.textContent=f.type==='password'?'Show':'Hide';
        ">Show</button>
      </span>`;
  }

  function scriptElapsed(s) {
    if (!s.started_at) return '—';
    const start = new Date(s.started_at);
    const end = s.completed_at ? new Date(s.completed_at) : new Date();
    const secs = Math.max(0, Math.round((end - start) / 1000));
    if (secs < 60) return secs + 's';
    const m = Math.floor(secs / 60), r = secs % 60;
    return r > 0 ? m + 'm ' + r + 's' : m + 'm';
  }

  function scriptLastLine(output) {
    if (!output) return '';
    const lines = output.split('\n')
      .map(l => l.trim())
      .filter(l => l.length > 0 && !l.startsWith('[Hatchery]'));
    return lines.length ? lines[lines.length - 1] : '';
  }

  const CHEVRON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>`;

  // Track which VMs / script sections the user has manually collapsed so the
  // state survives poll-driven re-renders.
  const collapsedVms = new Set();
  const collapsedScripts = new Set();

  function renderScripts(vm) {
    if (!vm.scripts || !vm.scripts.length) return '';

    const colHeader = `<div class="script-cols-header">
      <span>Script</span>
      <span>Elapsed</span>
      <span>Exit</span>
      <span>Last Output</span>
      <span>Status</span>
    </div>`;

    const rows = vm.scripts.map(s => {
      const cls = SCRIPT_STATUS_CLASS[s.status] || '';
      const lbl = SCRIPT_STATUS_LABEL[s.status] || escHtml(s.status);
      const elapsed = s.status === 'pending' ? '—' : scriptElapsed(s);
      const exit = s.exit_code !== null && s.exit_code !== undefined
        ? escHtml(String(s.exit_code)) : '—';
      // Prefer latest Write-HatchEvent; fall back to last raw output line.
      const lastLine = escHtml(s.last_event || scriptLastLine(s.output));
      return `<div class="script-row">
        <span class="script-col-name">${escHtml(s.script_name)}</span>
        <span class="script-col-elapsed">${elapsed}</span>
        <span class="script-col-exit">${exit}</span>
        <span class="script-col-last-output">${lastLine}</span>
        <span class="script-col-status script-status ${cls}">${lbl}</span>
      </div>`;
    }).join('');

    const canRetry = vm.session_id && vm.scripts.some(s => s.status === 'failed');
    const retryBtn = canRetry
      ? `<button class="btn btn-sm vm-retry-btn"
           data-session="${escHtml(vm.session_id)}" data-vm="${escHtml(vm.name)}">
           Retry
         </button>`
      : '';

    return `<div class="vm-scripts">
      <div class="vm-scripts-header">
        <button type="button" class="vm-scripts-toggle" aria-expanded="true">
          <span class="vm-scripts-chevron">${CHEVRON}</span>
          <span class="vm-scripts-title">Scripts</span>
        </button>
        ${retryBtn}
      </div>
      <div class="vm-scripts-body">
        ${colHeader}
        ${rows}
      </div>
    </div>`;
  }

  function renderVm(vm) {
    const sc = statusClass(vm.status);
    const label = VM_STATUS_LABEL[vm.status] || escHtml(vm.status);
    const hatchBadge = vm.hatch_status
      ? `<span class="hatch-status-badge hatch-status-badge--${escHtml(vm.hatch_status)}">${escHtml(HATCH_STATUS_LABEL[vm.hatch_status] || vm.hatch_status)}</span>`
      : '';
    return `
      <div class="vm-card">
        <div class="vm-card-header">
          <button type="button" class="vm-card-toggle" aria-expanded="true">
            <span class="vm-card-chevron">${CHEVRON}</span>
            <span class="vm-card-name">${escHtml(vm.name)}</span>
            <span class="hatch-status-badge hatch-status-badge--vm-${sc}">${label}</span>
            ${hatchBadge}
          </button>
        </div>
        <div class="vm-card-body">
          <div class="vm-row-fields">
            <div class="vm-field">
              <span class="vm-field-label">IP Address</span>
              <span class="vm-field-value">${vm.ip ? escHtml(vm.ip) : '<span class="vm-field-muted">—</span>'}</span>
            </div>
            <div class="vm-field">
              <span class="vm-field-label">Clutch</span>
              <span class="vm-field-value">${vm.clutch_file ? escHtml(vm.clutch_file) : '<span class="vm-field-muted">—</span>'}</span>
            </div>
            <div class="vm-field">
              <span class="vm-field-label">Hatched</span>
              <span class="vm-field-value">${fmtTime(vm.started_at)}</span>
            </div>
            <div class="vm-field">
              <span class="vm-field-label">Username</span>
              <span class="vm-field-value">${vm.admin_username ? escHtml(vm.admin_username) : '<span class="vm-field-muted">—</span>'}</span>
            </div>
            <div class="vm-field">
              <span class="vm-field-label">Password</span>
              <span class="vm-field-value">${renderPasswordCell(vm)}</span>
            </div>
          </div>
          ${renderScripts(vm)}
        </div>
      </div>`;
  }

  function applyCollapseState(card, vmName) {
    if (collapsedVms.has(vmName)) {
      card.querySelector('.vm-card-toggle').setAttribute('aria-expanded', 'false');
      card.querySelector('.vm-card-body').hidden = true;
    }
    if (collapsedScripts.has(vmName)) {
      const t = card.querySelector('.vm-scripts-toggle');
      const b = card.querySelector('.vm-scripts-body');
      if (t && b) { t.setAttribute('aria-expanded', 'false'); b.hidden = true; }
    }
  }

  function render(vms) {
    if (!vms.length) {
      vmList.querySelectorAll('.vm-card').forEach(r => r.remove());
      emptyMsg.style.display = '';
      return;
    }
    emptyMsg.style.display = 'none';

    const incoming = new Set(vms.map(v => v.name));
    vmList.querySelectorAll('.vm-card').forEach(el => {
      if (!incoming.has(el.dataset.vmName)) el.remove();
    });

    vms.forEach(vm => {
      const existing = vmList.querySelector(`.vm-card[data-vm-name="${CSS.escape(vm.name)}"]`);
      const tmp = document.createElement('div');
      tmp.innerHTML = renderVm(vm).trim();
      const newCard = tmp.firstElementChild;
      newCard.dataset.vmName = vm.name;
      applyCollapseState(newCard, vm.name);

      if (existing) {
        const prevScroll = existing.querySelector('.vm-scripts-body')?.scrollLeft ?? 0;
        existing.replaceWith(newCard);
        if (prevScroll) {
          const newBody = newCard.querySelector('.vm-scripts-body');
          if (newBody) newBody.scrollLeft = prevScroll;
        }
      } else {
        vmList.appendChild(newCard);
      }
    });
  }

  function poll() {
    fetch('/api/nests/local/vms')
      .then(r => r.json())
      .then(vms => {
        render(vms);
        refreshLabel.textContent = 'Updated ' + new Date().toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      })
      .catch(() => { refreshLabel.textContent = 'Update failed'; });
  }

  vmList.addEventListener('click', function (e) {
    // VM-level collapse toggle
    const cardToggle = e.target.closest('.vm-card-toggle');
    if (cardToggle) {
      const card = cardToggle.closest('.vm-card');
      const vmName = card.dataset.vmName;
      const expanded = cardToggle.getAttribute('aria-expanded') === 'true';
      cardToggle.setAttribute('aria-expanded', String(!expanded));
      card.querySelector('.vm-card-body').hidden = expanded;
      expanded ? collapsedVms.add(vmName) : collapsedVms.delete(vmName);
      return;
    }

    // Scripts section collapse toggle
    const scriptsToggle = e.target.closest('.vm-scripts-toggle');
    if (scriptsToggle) {
      const card = scriptsToggle.closest('.vm-card');
      const vmName = card ? card.dataset.vmName : null;
      const body = scriptsToggle.closest('.vm-scripts').querySelector('.vm-scripts-body');
      const expanded = scriptsToggle.getAttribute('aria-expanded') === 'true';
      scriptsToggle.setAttribute('aria-expanded', String(!expanded));
      body.hidden = expanded;
      if (vmName) { expanded ? collapsedScripts.add(vmName) : collapsedScripts.delete(vmName); }
      return;
    }

    // Retry button
    const retryBtn = e.target.closest('.vm-retry-btn');
    if (!retryBtn) return;
    const sessionId = retryBtn.dataset.session;
    const vmName = retryBtn.dataset.vm;
    retryBtn.disabled = true;
    retryBtn.textContent = 'Retrying…';
    fetch(`/api/sessions/${encodeURIComponent(sessionId)}/vms/${encodeURIComponent(vmName)}/retry`, {
      method: 'POST',
    }).then(() => poll()).catch(() => {
      retryBtn.disabled = false;
      retryBtn.textContent = 'Retry';
    });
  });

  poll();
  setInterval(poll, 5000);
})();
</script>
{% endblock %}
