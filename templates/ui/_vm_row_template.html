<template id="vm-row-template" data-windows-hatch-os="{{ windows_hatch_os_types | join(',') }}" data-reserved-env="{{ reserved_env_names | join(',') }}">
  <div class="vm-row" data-vm-index="">
    <div class="vm-row-header">
      <button type="button" class="vm-row-toggle" aria-expanded="false">
        <svg class="vm-row-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        <span class="vm-row-summary">New VM</span>
      </button>
      <button type="button" class="vm-row-remove btn-icon" title="Remove VM" aria-label="Remove VM">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="vm-row-body" hidden>
      <div class="form-grid form-grid-3">
        <div class="form-group">
          <label class="form-label">VM Name <span class="required">*</span></label>
          <input type="text" name="vm_name[]" class="form-input vm-name-input" required placeholder="e.g. dc01">
        </div>
        <div class="form-group">
          <label class="form-label">Guest OS <span class="required">*</span></label>
          <select name="vm_os[]" class="form-select" required>
            {% for os_type in os_types %}
              <option value="{{ os_type }}">{{ os_type }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Depends On</label>
          <select class="form-select vm-depends-on" multiple size="3" aria-label="Depends on other VMs">
            <!-- options populated by JS from current VM names -->
          </select>
          <input type="hidden" name="vm_depends_on[]" class="vm-depends-on-hidden" value="">
        </div>
      </div>
      <div class="form-grid form-grid-3">
        <div class="form-group">
          <label class="form-label">vCPUs <span class="required">*</span></label>
          <input type="number" name="vm_vcpus[]" class="form-input" required min="1" value="2">
        </div>
        <div class="form-group">
          <label class="form-label">RAM (GB) <span class="required">*</span></label>
          <input type="number" name="vm_ram_gb[]" class="form-input" required min="1" value="4">
        </div>
        <div class="form-group">
          <label class="form-label">Disk (GB) <span class="required">*</span></label>
          <input type="number" name="vm_disk_gb[]" class="form-input" required min="1" value="60">
        </div>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label">OS Media <span class="required">*</span></label>
            <button type="button" class="btn-refresh-label" data-refresh="iso" title="Refresh media files">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
          </div>
          <select name="vm_os_media[]" class="form-select" required>
            <option value="">- none -</option>
            {% for f in media_files %}
              <option value="{{ f }}">{{ f }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label">VirtIO Drivers</label>
            <button type="button" class="btn-refresh-label" data-refresh="virtio" title="Refresh media files">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
          </div>
          <select name="vm_virtio_drivers[]" class="form-select">
            <option value="">- none -</option>
            {% for f in virtio_files %}
              <option value="{{ f }}">{{ f }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      {# Create policy + Admin/Answer File: Windows hatch guests (#453 / #501) #}
      <div class="vm-windows-hatch-fields">
        <div class="form-grid form-grid-3">
          <div class="form-group">
            <label class="form-label">Firmware</label>
            <select name="vm_firmware[]" class="form-select vm-firmware-select" aria-label="Firmware">
              <option value="uefi">uefi</option>
              <option value="bios">bios</option>
            </select>
            <p class="form-hint">Portable create policy. Nest providers that cannot honor it fail hatch.</p>
          </div>
          <div class="form-group">
            <label class="form-label">TPM 2.0</label>
            <select name="vm_tpm[]" class="form-select vm-tpm-select" aria-label="TPM 2.0">
              <option value="true">true</option>
              <option value="false">false</option>
            </select>
            <p class="form-hint">Requires firmware uefi when true.</p>
          </div>
          <div class="form-group">
            <label class="form-label">Admin Username <span class="required vm-admin-username-required" hidden>*</span></label>
            <input type="text" name="vm_admin_username[]" class="form-input" placeholder="e.g. admin" autocomplete="off">
            <p class="form-hint">Required for Windows hatch through fledged. Injected as a reserved Answer File token.</p>
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <div class="form-label-row">
              <label class="form-label">Answer File <span class="required vm-answer-file-required" hidden>*</span></label>
              <button type="button" class="btn-refresh-label" data-refresh="answer_file" title="Refresh Answer Files">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              </button>
            </div>
            <select name="vm_answer_file[]" class="form-select" aria-label="Answer File">
              <option value="">- none -</option>
              {% for f in answer_file_files %}
                <option value="{{ f }}">{{ f }}</option>
              {% endfor %}
            </select>
            <div class="vm-answer-file-params"></div>
            <input type="hidden" name="vm_answer_file_parameters[]" class="vm-answer-file-parameters-hidden" value="">
          </div>
        </div>
      </div>
      <div class="form-group vm-environment-section">
        <div class="form-label-row">
          <label class="form-label">Guest Environment Variables</label>
          <span class="form-help-icon" data-tip="Reserved Hatchery path variables are injected for Script and Software jobs and persisted on Windows (Machine). User vars may inject and optionally persist with scope and mode. Software-scoped vars stay job-only.">i</span>
          <button type="button" class="btn-icon vm-env-add" title="Add variable" aria-label="Add environment variable">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <p class="form-hint vm-env-nonwindows-hint" hidden>Scope, persist, and mode apply on Windows guests. Other Guest OS families get name/value inject when remoting lands.</p>
        <div class="vm-env-reserved-block">
          <button type="button" class="vm-env-reserved-toggle" aria-expanded="false">
            <svg class="vm-env-reserved-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            <span class="vm-env-reserved-title">Reserved Hatchery variables</span>
          </button>
          <div class="vm-env-reserved script-params" role="group" aria-label="Reserved Hatchery environment variables" hidden></div>
        </div>
        <div class="vm-env-user-header" role="row" hidden>
          <span class="vm-env-col-name" title="Portable environment variable name">Name</span>
          <span class="vm-env-col-value" title="Value set for inject and optional persist">Value</span>
          <span class="vm-env-col-scope vm-env-advanced" title="Windows target: Machine (system) or User">Scope</span>
          <span class="vm-env-col-persist vm-env-advanced" title="Write to the guest environment (true) or inject for hatch jobs only (false)">Persist</span>
          <span class="vm-env-col-mode vm-env-advanced" title="Replace existing value, or append with a semicolon separator">Mode</span>
          <span class="vm-env-col-actions" aria-hidden="true"></span>
        </div>
        <div class="vm-env-user script-params" role="group" aria-label="User environment variables"></div>
        <p class="vm-env-error" role="alert" hidden></p>
        <input type="hidden" name="vm_environment[]" class="vm-environment-hidden" value="">
      </div>
      <div class="form-group">
        <div class="form-label-row">
          <label class="form-label">Post-boot Automations</label>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <div class="form-label-row">
              <label class="form-label">Scripts</label>
              <button type="button" class="btn-refresh-label vm-refresh-scripts" title="Refresh script list" aria-label="Refresh script list">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              </button>
            </div>
            <div class="script-add-row">
              <select class="form-select vm-script-select" aria-label="Select a script to add">
                <option value="">- select a script to add -</option>
                {% for f in scripts_files %}
                  <option value="{{ f }}">{{ f }}</option>
                {% endfor %}
              </select>
              <button type="button" class="btn vm-add-script">Add</button>
            </div>
            {% if not scripts_files %}
              <p class="form-hint">No scripts found. Add them via the Automations pane or Library.</p>
            {% endif %}
          </div>
          <div class="form-group">
            <div class="form-label-row">
              <label class="form-label">Software</label>
              <button type="button" class="btn-refresh-label vm-refresh-software" title="Refresh software list" aria-label="Refresh software list">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              </button>
            </div>
            <div class="script-add-row">
              <select class="form-select vm-software-select" aria-label="Select a software package to add">
                <option value="">- select software to add -</option>
                {% for f in software_files %}
                  <option
                    value="{{ f.name }}"
                    {% if f.definition_reboot_after %}data-definition-reboot-after="1"{% endif %}
                  >{{ f.name }}</option>
                {% endfor %}
              </select>
              <button type="button" class="btn vm-add-software">Add</button>
            </div>
            {% if not software_files %}
              <p class="form-hint">No software packages found. Pull packages via Library → Software.</p>
            {% endif %}
          </div>
        </div>
        <div class="vm-automations-list" aria-label="Ordered post-boot automations"></div>
        <input type="hidden" name="vm_automations[]" class="vm-automations-hidden" value="">
      </div>
    </div>
  </div>
</template>
