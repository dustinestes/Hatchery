# Clutch file schema reference
#
# A Clutch file defines one or more related VMs to be hatched together.
# A single-VM Clutch is valid. Multi-VM Clutches define an environment -
# for example, a domain controller and a joined client.
#
# Loaded and validated by: lib/clutch.py

# ── Top-level fields ───────────────────────────────────────────────────────────

# name (required): human-readable environment name
name: win-dev-lab

# description (optional): free-form description of this environment
description: Windows 11 development environment

# vms (required): list of one or more VM definitions
vms:

  # ── VM fields ───────────────────────────────────────────────────────────────

  - # name (required): unique identifier for this VM within the Clutch
    name: win11-dev

    # os (required): guest OS type
    # Accepted values: win10 | win11 | server2022 | server2025
    # Controls: Answer File / UEFI/TPM requirements (see docs/answer-files.md)
    os: win11

    # vcpus (required): number of virtual CPUs - must be >= 1
    vcpus: 4

    # ram_gb (required): RAM in GB - must be >= 1
    ram_gb: 8

    # disk_gb (required): disk size in GB - must be >= 1
    disk_gb: 80

    # os_media (required): source image for this VM
    # Filename relative to the media/ data directory, or an absolute path.
    # Accepts any format the hypervisor supports: ISO, VHD, VHDX, QCOW2.
    os_media: Win11_24H2.iso

    # virtio_drivers (optional): VirtIO driver package
    # Filename relative to the media/ data directory, or an absolute path.
    # Enables high-performance VirtIO disk and network adapters on Windows guests.
    # Omit to fall back to standard IDE/e1000 adapters (no extra setup required).
    virtio_drivers: virtio-win.iso

    # admin_username (required for Windows guests): administrator account for unattended
    # install / hatch→fledged. Injected as reserved system tokens into the selected Answer File
    # (ADR-0024 / #465). Password is supplied at hatch time. Hatch-scoped through fledged -
    # rotate after fledged if the guest outlives setup (#455). Hidden / not required for
    # non-Windows Guest OS (#453).
    admin_username: admin

    # answer_file (required for Windows guests): Answer File under automation/answerfiles/
    # Legacy Clutch key ``os_config`` is still accepted on load (ADR-0024 / #448).
    # Windows: Autounattend Jinja template rendered with system tokens + declared params.
    # Linux (future): cloud-init / kickstart / preseed Answer File.
    answer_file: win11-autounattend.xml.j2

    # answer_file_parameters: map of user-declared Answer File parameters (#451)
    answer_file_parameters:
      input_locale: en-US
      system_locale: en-US

    # automations (optional): ordered typed post-boot steps (#473 / ADR-0025).
    # Every entry requires type: script|software and name. Bare strings rejected.
    # script name = basename under automation/scripts/
    # software name = package id under automation/software/
    automations:
      - type: script
        name: install-chocolatey.ps1
      - type: software
        name: Hatchery.SoftwareExample.1.0.0
      - type: script
        name: install-dev-tools.ps1

    # depends_on (optional): VM names in this Clutch that must be fully fledged
    # before this VM is hatched. VMs with no dependencies hatch in parallel.
    # Omit or leave empty for no dependency.
    depends_on: []


# ── Multi-VM example ───────────────────────────────────────────────────────────
