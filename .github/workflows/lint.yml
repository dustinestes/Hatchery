name: Lint

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ruff
        run: pip install ruff

      - name: Check
        run: ruff check .

      - name: Format
        run: ruff format --check .
