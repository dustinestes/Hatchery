name: Test

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**.py'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ --cov --cov-fail-under=60 --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
