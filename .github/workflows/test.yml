name: Test

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**.py'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  # PR merge wait: ubuntu + macos (+ Lint workflow). See #400.
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      # Portable suite only. Tests marked @pytest.mark.hypervisor need a real Nest
      # and are excluded from CI (see docs/tests.md).
      - name: Run tests
        run: uv run pytest -m "not hypervisor" --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          retention-days: 14

  # Windows: post-merge on main (and manual dispatch). Not on pull_request so the
  # PR merge button goes green when lint + ubuntu + macos finish (~1 min). A red
  # Windows run on the main push still fails the workflow and sends alerts (#400).
  test-windows:
    name: pytest (windows-latest)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -m "not hypervisor" --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-windows-latest
          path: coverage.xml
          retention-days: 14
