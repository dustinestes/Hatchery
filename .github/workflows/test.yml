name: Test

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**.py'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test.yml'
  workflow_dispatch:

# New pushes cancel superseded runs on the same ref (frees Windows runner pool).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Merge confidence: ubuntu + macos (+ Lint). See #400.
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      # Portable suite only. Tests marked @pytest.mark.hypervisor need a real Nest
      # and are excluded from CI (see docs/tests.md).
      - name: Run tests
        run: uv run pytest -m "not hypervisor" --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          retention-days: 14

  # Same portable suite on Windows. Runs on PRs and on push to main so you still
  # see the check and get failure alerts. Not a required status check - merge when
  # lint + ubuntu + macos are green even if this job is still running (#400).
  test-windows:
    name: pytest (windows-latest)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -m "not hypervisor" --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-windows-latest
          path: coverage.xml
          retention-days: 14
